name: Dictascade
options:
  bundleIdPrefix: com.dictascade
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.9.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    # Pin the verified FluidAudio revision for reproducible builds.
    revision: "6f7938938f1580d1abee28dd980b5f79da5f794c"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.0.0"

targets:
  Dictascade:
    type: application
    platform: macOS
    sources:
      - Dictascade
    settings:
      base:
        INFOPLIST_FILE: Dictascade/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dictascade/Resources/Dictascade.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.dictascade.app
        MARKETING_VERSION: "1.4.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: H7B584W2D6
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "Dictascade macOS Dev ID"
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: WhisperKit
      - package: FluidAudio
      - package: KeyboardShortcuts

  VocabularyPolicyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DictascadeTests
      - Dictascade/Services/VocabularyPolicy.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: FluidAudio

  PasteboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PasteboardTests
      - Dictascade/Services/PasteboardTransaction.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
