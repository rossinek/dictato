name: Dictato
options:
  bundleIdPrefix: com.dictato
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.9.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.12.2"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.0.0"

targets:
  Dictato:
    type: application
    platform: macOS
    sources:
      - Dictato
    settings:
      base:
        INFOPLIST_FILE: Dictato/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dictato/Resources/Dictato.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.dictato.ios
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: H7B584W2D6
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: WhisperKit
      - package: FluidAudio
      - package: KeyboardShortcuts
