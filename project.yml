name: Dictato
options:
  bundleIdPrefix: com.dictato
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.9.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.0.0"

targets:
  Dictato:
    type: application
    platform: macOS
    sources:
      - Dictato
    settings:
      base:
        INFOPLIST_FILE: Dictato/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dictato/Resources/Dictato.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.dictato.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: WhisperKit
      - package: KeyboardShortcuts
