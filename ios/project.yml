name: Dictascade
options:
  bundleIdPrefix: com.dictascade
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "26.0"

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.12.2"

targets:
  Dictascade:
    type: application
    platform: iOS
    sources:
      - Dictascade
    settings:
      base:
        INFOPLIST_FILE: Dictascade/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.dictascade.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: H7B584W2D6
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: FluidAudio
