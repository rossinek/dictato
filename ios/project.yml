name: Dictascade
options:
  bundleIdPrefix: com.dictascade
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "26.0"

packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.12.2"

targets:
  Dictascade:
    type: application
    platform: iOS
    sources:
      - Dictascade
      - Shared
    settings:
      base:
        INFOPLIST_FILE: Dictascade/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Dictascade/Resources/Dictascade.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.dictascade.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: H7B584W2D6
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: FluidAudio
      - target: DictascadeWidgetExtension

  DictascadeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - DictascadeWidget
      - Shared
    settings:
      base:
        INFOPLIST_FILE: DictascadeWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.dictascade.app.widget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: H7B584W2D6
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"
